name: Build DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Download yt-dlp (macOS standalone)
        run: |
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_mos -o /tmp/yt-dlp
          chmod +x /tmp/yt-dlp
          /tmp/yt-dlp --version

      - name: Download ffmpeg (macOS static)
        run: |
          # 尝试从 evermeet.cx 下载 macOS 静态 ffmpeg
          curl -sL https://evermeet.cx/ffmpeg/ffmpeg/8.1.1/ffmpeg-8.1.1.7z -o /tmp/ffmpeg.7z
          bsdtar xf /tmp/ffmpeg.7z -C /tmp 2>/dev/null || {
            # 备选: 从 github 下载编译好的二进制
            curl -sL https://github.com/eugeneware/ffmpeg-static/releases/latest/download/darwin-x64 -o /tmp/ffmpeg
          }
          chmod +x /tmp/ffmpeg 2>/dev/null
          /tmp/ffmpeg -version 2>&1 | head -1 || echo "ffmpeg 下载失败，将使用系统安装"

      - name: Build (Release)
        run: swift build -c release

      - name: Package .app
        run: |
          APP="YouTubeToWAV.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/bin"

          # 拷贝编译产物
          cp .build/release/YouTubeToWAV "$APP/Contents/MacOS/"

          # 拷贝资源文件
          cp -r Sources/YouTubeToWAV/Resources/* "$APP/Contents/Resources/" 2>/dev/null || true

          # 将 yt-dlp 和 ffmpeg 打包进 .app 的 bin/ 目录
          cp /tmp/yt-dlp "$APP/Contents/Resources/bin/"
          if [ -f /tmp/ffmpeg ] && [ -x /tmp/ffmpeg ]; then
            cp /tmp/ffmpeg "$APP/Contents/Resources/bin/"
          fi
          ls -lh "$APP/Contents/Resources/bin/"

          # Info.plist
          cat > "$APP/Contents/Info.plist" <<-PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>YouTubeToWAV</string>
            <key>CFBundleExecutable</key>
            <string>YouTubeToWAV</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.youtubetowav.app</string>
            <key>CFBundleName</key>
            <string>YouTubeToWAV</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
          </dict>
          </plist>
          PLIST

          echo "APPL????" > "$APP/Contents/PkgInfo"

          # Ad-hoc 签名（包含 bin/ 里的可执行文件）
          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "YouTubeToWAV" \
            --window-pos 200 200 \
            --window-size 400 300 \
            --icon-size 100 \
            --icon "YouTubeToWAV.app" 200 120 \
            --app-drop-link 200 220 \
            --no-internet-enable \
            "YouTubeToWAV.dmg" \
            "YouTubeToWAV.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeToWAV-dmg
          path: YouTubeToWAV.dmg
